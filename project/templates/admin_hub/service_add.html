{% extends 'base.html' %}

{% block title %}Tambah Layanan - MotoFix{% endblock %}

{% block content %}
<h2>➕ Tambah Layanan Baru</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div style="margin: 1rem 0;">
            <label>Nama Layanan:</label><br>
            <input type="text" name="name" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
        </div>
        <div style="margin: 1rem 0;">
            <label>Deskripsi:</label><br>
            <textarea name="description" rows="3" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;"></textarea>
        </div>
        <div style="margin: 1rem 0;">
            <label>Harga (Rp):</label><br>
            <input type="number" name="price" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
        </div>
        <div style="margin: 1rem 0;">
            <label>Estimasi Waktu (menit):</label><br>
            <input type="number" name="duration" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
        </div>
        <button type="submit" class="btn">Simpan Layanan</button>
        <a href="{% url 'admin_hub:service_list' %}" class="btn btn-secondary">Batal</a>
    </form>
</div>
{% endblock %}
